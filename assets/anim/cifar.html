function setPlaying(value) {
 playing = value;
 previousTime = null;
 card.classList.toggle('paused', !playing);
 toggle.textContent = playing ? 'Pause' : 'Play';
 toggle.setAttribute('aria-label', playing ? 'Pause animation' : 'Play animation');
}
window.addEventListener('message', event => {
 if (window.parent === window || event.source !== window.parent || event.origin !== location.origin) return;
 if (event.data?.type !== 'peira-animation-visibility' || typeof event.data.visible !== 'boolean') return;
 if (frameVisible === event.data.visible) return;
 frameVisible = event.data.visible;
 elapsed = frameVisible && !motion.matches ? 0 : POSTER;
 setPlaying(frameVisible && !motion.matches);
 render();
});
toggle.addEventListener('click', () => setPlaying(!playing));
document.querySelector('#replay').addEventListener('click', () => { elapsed = 0; setPlaying(true); render(); });
for (const button of steps) button.addEventListener('click', () => { elapsed = stageStarts[Number(button.dataset.step)] + 4.2; setPlaying(false); render(); });
timeline.addEventListener('input', () => { elapsed = Number(timeline.value); setPlaying(false); render(); });
motion.addEventListener('change', event => { if (event.matches) setPlaying(false); render(); });
document.addEventListener('visibilitychange', () => { previousTime = null; });
function tick(now) {
 if (playing && frameVisible && !document.hidden) {
  if (previousTime !== null) elapsed = (elapsed + Math.min((now - previousTime) / 1000, .1)) % duration;
  previousTime = now;
  render();
 }
 requestAnimationFrame(tick);
}
setPlaying(playing);
render();
requestAnimationFrame(tick);
</script>
</body>
</html>
